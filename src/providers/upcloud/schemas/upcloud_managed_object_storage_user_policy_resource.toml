section = "Managed Object Storage"

[inputs.service_uuid]
type = "string"
required = true
force_new = true
description = "UUID of the parent upcloud.managed_object_storage service. Typically referenced from a parent service resource's `uuid` output. Cannot be changed — moving an attachment between services would require detaching and reattaching."

[inputs.username]
type = "string"
required = true
force_new = true
description = "Service user the policy is attached to. Typically referenced from a parent upcloud.managed_object_storage_user resource's `username` output. Cannot be changed — moving an attachment between users would require detaching and reattaching."

[inputs.policy_name]
type = "string"
required = true
force_new = true
description = "Name of the IAM policy to attach (e.g. 'ECSS3FullAccess', 'IAMFullAccess'). Must reference a policy that already exists in the parent service. Cannot be changed — to swap policies, replace the attachment."

[outputs.service_uuid]
type = "string"
description = "UUID of the parent service. Mirrored from inputs."

[outputs.username]
type = "string"
description = "Service user that owns this attachment. Mirrored from inputs."

[outputs.policy_name]
type = "string"
description = "Attached policy name. Mirrored from inputs."

[outputs.arn]
type = "string"
description = "Amazon-style resource name for the attached policy (e.g. `urn:ecs:iam:::policy/ECSS3FullAccess`). Looked up from the user's policy listing after attachment."
